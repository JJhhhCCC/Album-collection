<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00afcb" />
    <meta name="description" content="只保存在本机浏览器里的翻页照片书。" />
    <title>照片书</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2300afcb' d='M9 8h35c6 0 11 5 11 11v37H20c-6 0-11-5-11-11z'/%3E%3Cpath fill='none' stroke='%23000' stroke-width='4' d='M12 10h32c6 0 10 4 10 10v34H21c-5 0-9-4-9-9zM21 10v44'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="desktop-stage">
      <main class="app-shell" aria-label="照片书">
        <header class="topbar">
          <button class="topbar-button" id="manageButton" type="button" hidden>整理</button>
          <h1>照片书</h1>
          <button class="topbar-button topbar-button--primary" id="addButton" type="button">添加</button>
        </header>
        <p class="privacy-note" id="privacyNote">照片只保存在这台设备，不会上传。</p>
        <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
        <section class="library-view" id="libraryView" aria-label="书本列表">
          <div class="empty-state" id="emptyState">
            <span class="empty-state__book" aria-hidden="true"></span>
            <h2>把照片收进书里</h2>
            <p>每组照片会成为一本书，按顺序叠放。</p>
            <button class="primary-action" id="emptyAddButton" type="button">添加第一本书</button>
          </div>
          <div class="library-actions" id="libraryActions" hidden><span>拖动或用箭头调整顺序</span><button id="clearAllButton" type="button">清空全部</button></div>
          <div class="stack-frame" id="stackFrame" hidden><div class="book-stack" id="bookStack"></div></div>
        </section>
        <section class="composer" id="composer" aria-labelledby="composerTitle" aria-modal="true" role="dialog" hidden>
          <div class="composer__sheet">
            <header class="composer__header">
              <button class="icon-button" id="closeComposerButton" type="button" aria-label="关闭上传面板">×</button>
              <div><p class="eyebrow">建立书本</p><h2 id="composerTitle">添加图片组</h2></div>
              <span class="composer__count" id="groupCount">0 本</span>
            </header>
            <p class="composer__hint">一组图片就是一本书。可在生成前调整书本和照片的顺序。</p>
            <div class="staging-groups" id="stagingGroups"></div>
            <div class="composer__footer"><button class="secondary-action" id="addGroupButton" type="button">+ 添加一本书</button><button class="primary-action" id="generateButton" type="button" disabled>生成书本</button></div>
          </div>
        </section>
        <section class="reader" id="reader" aria-label="照片阅读器" aria-hidden="true" hidden>
          <header class="reader__header"><button class="icon-button icon-button--back" id="closeReaderButton" type="button" aria-label="返回书架">←</button><div class="reader__title"><strong id="readerBookTitle">book1</strong><span id="readerPageLabel">1 / 1</span></div><button class="icon-button" id="resetZoomButton" type="button" aria-label="重置缩放" hidden>◎</button></header>
          <div class="reader__stage" id="readerStage"><button class="reader__tap-zone reader__tap-zone--previous" id="previousPageButton" type="button" aria-label="上一页"></button><figure class="reader-paper" id="readerPaper"><div class="reader-paper__image-wrap" id="readerImageWrap"><img id="readerImage" alt="" draggable="false" /></div><figcaption id="readerCaption"></figcaption></figure><button class="reader__tap-zone reader__tap-zone--next" id="nextPageButton" type="button" aria-label="下一页"></button></div>
          <p class="reader__tip" id="readerTip">左右滑动翻页 · 双指缩放照片</p>
        </section>
        <input id="fileInput" type="file" accept="image/*,.heic,.heif" multiple hidden />
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
